name: Release Windows

# Builds the Dalnovid desktop client for Windows x64 (Flutter UI + Rust core)
# and packs it as a single self-extracting .exe. Run by hand or on a tag.
#
# The default ID server and its public key are baked in at build time. They
# come from the run inputs, or else from the repository variables
# DALNOVID_SERVER and DALNOVID_PUBKEY (Settings -> Secrets and variables ->
# Actions -> Variables). Without them the client ships with no server.
#
# Adapted from upstream flutter-build.yml (see .github/workflows-upstream/).
# Left out for now: code signing, MSI, printer driver, virtual display driver,
# privacy-mode helper.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release tag to create, e.g. v0.1.0-alpha.1 (empty = artifacts only)"
        required: false
        default: ""
      server:
        description: "Default ID server (empty = repository variable DALNOVID_SERVER)"
        required: false
        default: ""
      pubkey:
        description: "Server public key (empty = repository variable DALNOVID_PUBKEY)"
        required: false
        default: ""
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  bridge:
    name: Generate Flutter-Rust bridge
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true
      - name: Install bridge codegen
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
      - name: Generate bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  windows:
    name: Windows x86_64
    needs: bridge
    runs-on: windows-2022
    env:
      DALNOVID_RENDEZVOUS_SERVER: ${{ inputs.server || vars.DALNOVID_SERVER }}
      DALNOVID_RS_PUB_KEY: ${{ inputs.pubkey || vars.DALNOVID_PUBKEY }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Show baked-in server
        shell: bash
        run: |
          echo "ID server: ${DALNOVID_RENDEZVOUS_SERVER:-<none>}"
          echo "Public key set: $([ -n "$DALNOVID_RS_PUB_KEY" ] && echo yes || echo no)"

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685 (same engine build upstream ships)
      - name: Replace Flutter engine with the patched build
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)
          $engine = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          Write-Host "Flutter engine dir: $engine"
          if (-not (Test-Path $engine)) { Write-Error "engine dir not found"; exit 1 }
          Copy-Item -Recurse -Force windows-x64-release\* $engine

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./dalnovid

      - name: Check there is no built-in third-party server
        shell: bash
        run: |
          ! grep -a -E 'rs-ny\.rustdesk\.com|admin\.rustdesk\.com|api\.rustdesk\.com/version' dalnovid/*.dll dalnovid/*.exe

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          r=$(find . -name "Runner.res" | head -1)
          [ -n "$r" ] && cp "$r" ./libs/portable/Runner.res || echo "Runner.res not found"

      - name: Version
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then V="$GITHUB_REF_NAME"; fi
          [ -n "$V" ] || V="dev-${GITHUB_SHA::7}"
          echo "DALNOVID_VERSION=$V" >> "$GITHUB_ENV"

      - name: Build self-extracting executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../dalnovid/ -o . -e ../../dalnovid/rustdesk.exe
          popd
          mkdir -p ./out
          mv ./target/release/rustdesk-portable-packer.exe "./out/dalnovid-${DALNOVID_VERSION}-windows-x86_64.exe"
          7z a "./out/dalnovid-${DALNOVID_VERSION}-windows-x86_64-folder.zip" ./dalnovid/* > /dev/null
          ls -l ./out

      - uses: actions/upload-artifact@v4
        with:
          name: dalnovid-windows-x86_64
          path: ./out/*

      - name: Publish pre-release
        if: inputs.version != '' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DALNOVID_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Dalnovid ${{ env.DALNOVID_VERSION }}
          prerelease: true
          files: ./out/*
